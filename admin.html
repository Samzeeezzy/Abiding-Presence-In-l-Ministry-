
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ministry Admin | Abiding Presence</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #f5f3ed; color: #183b2d;
    }
    header {
      background: #123c2b; color: white;
      padding: 22px; display: flex;
      justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap;
    }
    main { max-width: 1050px; margin: 30px auto; padding: 16px; }
    .panel {
      background: white; padding: 24px; margin-bottom: 22px;
      border-radius: 14px; box-shadow: 0 4px 18px #0000000d;
    }
    h1, h2 { margin-top: 0; }
    label { display: block; font-weight: bold; margin: 14px 0 6px; }
    input, textarea, select {
      width: 100%; padding: 12px; border: 1px solid #ccc;
      border-radius: 8px; font: inherit;
    }
    button {
      background: #bd9850; color: #152d21; border: 0;
      padding: 12px 17px; border-radius: 8px; cursor: pointer;
      font-weight: bold; margin-top: 14px;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #e8e6df; }
    .danger { background: #f6dddd; color: #8a2020; }
    .hidden { display: none !important; }
    #status { margin-top: 14px; overflow-wrap: anywhere; }
    .media-grid {
      display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
      gap: 18px;
    }
    .media-card {
      border: 1px solid #e5e2d9; border-radius: 12px;
      padding: 14px; min-width: 0;
    }
    .media-card img, .media-card video, .media-card audio {
      width: 100%; max-height: 230px; object-fit: contain;
      margin-bottom: 10px;
    }
    .muted { color: #666; font-size: .92rem; }
  </style>
</head>
<body>
<header>
  <div>
    <strong>Abiding Presence International Ministry</strong>
    <div class="muted" style="color:#eee">Media Administration</div>
  </div>
  <button id="logoutBtn" class="secondary hidden">Log out</button>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h1>Administrator Login</h1>
    <p>Sign in with your authorized ministry administrator account.</p>
    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" type="submit">Sign in</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h1>Media Dashboard</h1>
      <p>Upload and manage ministry images, videos and audio.</p>
      <form id="uploadForm">
        <label for="title">Media title</label>
        <input id="title" maxlength="150" required>

        <label for="description">Description</label>
        <textarea id="description" rows="3" maxlength="2000"></textarea>

        <label for="mediaType">Media type</label>
        <select id="mediaType" required>
          <option value="image">Image</option>
          <option value="video">Video</option>
          <option value="audio">Audio</option>
        </select>

        <label for="file">Choose file from your computer</label>
        <input id="file" type="file"
          accept="image/*,video/*,audio/*" required>

        <label>
          <input id="published" type="checkbox" checked
            style="width:auto;margin-right:8px">
          Publish immediately
        </label>
        <button id="uploadBtn" type="submit">Upload media</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </div>

    <div class="panel">
      <h2>Uploaded Media</h2>
      <button id="refreshBtn" class="secondary">Refresh list</button>
      <div id="mediaList" class="media-grid" style="margin-top:20px"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const status = $('status');
  let supabaseClient;
  let currentUser;

  function message(text) {
    status.textContent = text;
  }

  function setBusy(button, busy, label) {
    button.disabled = busy;
    if (busy) {
      button.dataset.originalText = button.textContent;
      button.textContent = label || 'Please wait...';
    } else if (button.dataset.originalText) {
      button.textContent = button.dataset.originalText;
      delete button.dataset.originalText;
    }
  }

  function showDashboard() {
    $('loginPanel').classList.add('hidden');
    $('dashboard').classList.remove('hidden');
    $('logoutBtn').classList.remove('hidden');
  }

  function showLogin() {
    $('loginPanel').classList.remove('hidden');
    $('dashboard').classList.add('hidden');
    $('logoutBtn').classList.add('hidden');
  }

  function safeText(tag, text, className) {
    const node = document.createElement(tag);
    node.textContent = text || '';
    if (className) node.className = className;
    return node;
  }

  function mediaUrl(path) {
    return supabaseClient.storage.from('ministry-media').getPublicUrl(path).data.publicUrl;
  }

  function addPreview(card, item) {
    const url = mediaUrl(item.file_path);
    let element;
    if (item.media_type === 'image') {
      element = document.createElement('img');
      element.alt = item.title;
    } else if (item.media_type === 'video') {
      element = document.createElement('video');
      element.controls = true;
    } else {
      element = document.createElement('audio');
      element.controls = true;
    }
    element.src = url;
    element.loading = 'lazy';
    card.appendChild(element);
  }

  async function loadMedia() {
    const list = $('mediaList');
    list.replaceChildren(safeText('p', 'Loading media...'));
    const { data, error } = await supabaseClient
      .from('media_items')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      list.replaceChildren(safeText('p', 'Could not load media: ' + error.message));
      return;
    }

    list.replaceChildren();
    if (!data.length) {
      list.appendChild(safeText('p', 'No media uploaded yet.'));
      return;
    }

    data.forEach(item => {
      const card = document.createElement('article');
      card.className = 'media-card';
      addPreview(card, item);
      card.appendChild(safeText('h3', item.title));
      card.appendChild(safeText('p', item.description, 'muted'));
      card.appendChild(safeText('p',
        item.media_type.toUpperCase() + ' · ' +
        (item.published ? 'Published' : 'Unpublished'), 'muted'));

      const toggle = document.createElement('button');
      toggle.className = 'secondary';
      toggle.textContent = item.published ? 'Unpublish' : 'Publish';
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        const { error } = await supabaseClient.from('media_items')
          .update({ published: !item.published, updated_at: new Date().toISOString() })
          .eq('id', item.id);
        if (error) {
          alert('Update failed: ' + error.message);
          toggle.disabled = false;
        } else {
          await loadMedia();
        }
      });
      card.appendChild(toggle);

      const remove = document.createElement('button');
      remove.className = 'danger';
      remove.textContent = 'Delete';
      remove.addEventListener('click', async () => {
        if (!confirm('Delete "' + item.title + '" permanently?')) return;
        remove.disabled = true;
        const { error: fileError } = await supabaseClient.storage
          .from('ministry-media').remove([item.file_path]);
        if (fileError) {
          alert('File deletion failed: ' + fileError.message);
          remove.disabled = false;
          return;
        }
        const { error } = await supabaseClient.from('media_items')
          .delete().eq('id', item.id);
        if (error) {
          alert('Database deletion failed: ' + error.message);
          remove.disabled = false;
        } else {
          await loadMedia();
        }
      });
      card.appendChild(remove);
      list.appendChild(card);
    });
  }

  async function verifySession() {
    const { data, error } = await supabaseClient.auth.getUser();
    if (error || !data.user ||
        data.user.id !== window.MINISTRY_ADMIN_ID) {
      currentUser = null;
      showLogin();
      return false;
    }
    currentUser = data.user;
    showDashboard();
    await loadMedia();
    return true;
  }

  try {
    if (!window.MINISTRY_SUPABASE_URL ||
        window.MINISTRY_SUPABASE_URL.includes('PASTE_') ||
        !window.MINISTRY_SUPABASE_KEY ||
        window.MINISTRY_SUPABASE_KEY.includes('PASTE_')) {
      throw new Error('Open config.js and add your Supabase Project URL and Publishable Key.');
    }
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('Supabase library did not load. Refresh and try again.');
    }

    supabaseClient = window.supabase.createClient(
      window.MINISTRY_SUPABASE_URL,
      window.MINISTRY_SUPABASE_KEY
    );

    $('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = $('loginBtn');
      setBusy(button, true, 'Signing in...');
      message('');
      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: $('email').value.trim(),
          password: $('password').value
        });
        if (error) throw error;
        const ok = await verifySession();
        if (!ok) {
          await supabaseClient.auth.signOut();
          throw new Error('This account is not authorized as the ministry administrator.');
        }
        $('password').value = '';
        message('Signed in successfully.');
      } catch (error) {
        message(error.message || 'Sign-in failed.');
      } finally {
        setBusy(button, false);
      }
    });

    $('uploadForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!currentUser || currentUser.id !== window.MINISTRY_ADMIN_ID) {
        message('Please sign in with the authorized administrator account.');
        return;
      }
      const button = $('uploadBtn');
      setBusy(button, true, 'Uploading...');
      message('');
      try {
        const file = $('file').files[0];
        if (!file) throw new Error('Choose a file first.');
        const type = $('mediaType').value;
        if (!file.type.startsWith(type + '/')) {
          throw new Error('The selected file does not match the chosen media type.');
        }
        if (file.size > 100 * 1024 * 1024) {
          throw new Error('Please choose a file smaller than 100 MB.');
        }
        const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = Date.now() + '-' + crypto.randomUUID() + '-' + cleanName;

        const { error: uploadError } = await supabaseClient.storage
          .from('ministry-media')
          .upload(path, file, { upsert: false, contentType: file.type });
        if (uploadError) throw uploadError;

        const { error: recordError } = await supabaseClient
          .from('media_items').insert({
            title: $('title').value.trim(),
            description: $('description').value.trim(),
            media_type: type,
            file_path: path,
            file_name: file.name,
            published: $('published').checked,
            created_by: currentUser.id
          });

        if (recordError) {
          await supabaseClient.storage.from('ministry-media').remove([path]);
          throw recordError;
        }

        $('uploadForm').reset();
        $('published').checked = true;
        message('Upload successful!');
        await loadMedia();
      } catch (error) {
        message('Upload failed: ' + (error.message || 'Unknown error'));
      } finally {
        setBusy(button, false);
      }
    });

    $('refreshBtn').addEventListener('click', loadMedia);
    $('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      currentUser = null;
      showLogin();
      message('You have signed out.');
    });

    await verifySession();
  } catch (error) {
    showLogin();
    message(error.message || 'Could not initialize dashboard.');
    $('loginPanel').appendChild(safeText('p',
      'Check that config.js is correct and the Supabase project is available.', 'muted'));
  }
})();
</script>
</body>
</html>
